<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D-Point - Leaderboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="flex-col">
        <div class="flex-row">
            <div id="title">D-Point Leaderboard</div>
            <div class="flex-grow"></div>
            <div>{{ sync_state }}</div>
        </div>
        <div class="flex-col">
            {% for user in users %}
                <div class="flex-row">
                    <div class="score">{{ loop.index ~ ". " }}<b>{{ user.username|e }}</b> <i>with {{ user.score }} points (last scored at {{ user.last_score }})</i></div>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
